
<!DOCTYPE html>
<html>
<head>
    <title>Book Information</title>
</head>
<body>

<h1>Book Information</h1>

<h2>First Book Title</h2>
<p id="firstTitle"></p>

<h2>Second Book Author</h2>
<p id="secondAuthor"></p>

<h2>Genres of Both Books</h2>
<div id="genres"></div>

<p id="error" role="status"></p>

<script>
async function loadBooks() {
    try {
        const response = await fetch("books.json");

        if (!response.ok) {
            throw new Error("Unable to load book data.");
        }

        const data = await response.json();

        document.getElementById("firstTitle").textContent =
            data.books[0].title;

        document.getElementById("secondAuthor").textContent =
            data.books[1].author;

        const genres = document.getElementById("genres");

        data.books.forEach(function(book) {
            const heading = document.createElement("h3");
            heading.textContent = book.title;

            const paragraph = document.createElement("p");
            paragraph.textContent = book.genres.join(", ");

            genres.appendChild(heading);
            genres.appendChild(paragraph);
        });

    } catch (error) {
        document.getElementById("error").textContent =
            "Error: Unable to load book data. Please check the JSON file and try again.";
    }
}

loadBooks();
</script>

</body>
</html>
